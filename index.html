<!DOCTYPE html>
<html>
<head>
    <title>Google Classroom - Dashboard View</title>
    <style>
        /* This forces the game box to fill your entire screen perfectly */

            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
